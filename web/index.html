<!doctype html><html lang="ku-Arab" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#103c32"><title>ڕووناهی · قورئانا پیرۆز</title>
<style>
*{box-sizing:border-box}body{--bg:#f6f8f6;--paper:#fff;--ink:#153b32;--muted:#536b62;--line:#d4dfd6;--shade:#e9f1eb;margin:0;color:var(--ink);background:var(--bg);font:17px/1.7 system-ui,sans-serif}body.night{--bg:#10231e;--paper:#182e27;--ink:#e5eee8;--muted:#b2c5ba;--line:#375247;--shade:#254438}button,input,select{font:inherit;color:inherit}button,a,select{touch-action:manipulation}button,select{cursor:pointer}a{color:inherit}button,.pill,select{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:7px 14px}button:hover,.pill:hover{border-color:#93804a}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #ab8448}header{background:var(--paper);border-bottom:1px solid var(--line)}nav,main,footer{max-width:1120px;margin:auto;padding:14px 24px}nav,.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}nav{justify-content:space-between}.brand{text-decoration:none;font:bold 30px Georgia,serif}.mark{color:#ac8946}.hero{position:relative;isolation:isolate;overflow:hidden;margin:16px 0 24px;padding:46px clamp(22px,6vw,74px);border-radius:24px;background:linear-gradient(110deg,#092a23,#215746);color:#fff}.art{position:absolute;inset:0 43% 0 0;z-index:-1;opacity:.65;background:repeating-radial-gradient(ellipse at 30% 120%,transparent 0 19px,#bdad732e 20px 21px,transparent 22px 28px)}.art:after{content:"";position:absolute;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#ffe7a6,#bf984a 67%,#907442);left:25%;top:18%;box-shadow:0 0 50px #eac56c44}.hero h1{font:normal clamp(38px,7vw,70px)/1.4 Georgia,serif;margin:0 0 15px}.hero a{background:#f5e5b7;color:#163c32;text-decoration:none;border:0}.search{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:13px 18px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.card{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius .browse{display:inline-flex;gap:4px;padding:4px;background:var(--shade);border-radius:14px}.browse a{padding:5px 24px;text-decoration:none;border-radius:10px}.browse a[aria-current=page]{background:var(--paper);box-shadow:0 2px 6px #102b2114}.options{padding:12px 16px;margin:12px 0;border:1px solid var(--line);border-radius:14px;background:var(--paper)}summary{cursor:pointer;font-weight:600}.options .row{margin-top:12px}.options label{display:grid;gap:3px;color:var(--muted)}#player{position:fixed;z-index:4;bottom:0;left:50%;transform:translateX(-50%);width:min(96%,720px);padding:10px 15px max(10px,env(safe-area-inset-bottom));box-shadow:0 2px 30px #07261c33;border:1px solid var(--line)}#player .row{justify-content:space-between}#player audio{display:block;width:100%;height:40px;margin-top:5px}#error:empty{display:none}body:has(#player:not([hidden])){padding-bottom:140px}.card .num{font-variant-numeric:tabular-nums}.card{min-height:82px}.hero{background:linear-gradient(115deg,#092c25,#174b3e 60%,#225f4d)}article{scroll-margin-top:12px}
